name: Build and Run Game

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        default: 'debug'
        required: true
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v2

    - name: Build APK
      run: ./gradlew assemble${{ inputs.build_type == 'release' && 'Release' || 'Debug' }}

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-${{ inputs.build_type }}.apk
        path: app/build/outputs/apk/${{ inputs.build_type }}/app-${{ inputs.build_type }}.apk

    - name: Generate APK download link
      run: |
        echo "## APK Build Successful ✅" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build Type:** ${{ inputs.build_type }}" >> $GITHUB_STEP_SUMMARY
        echo "**APK Name:** app-${{ inputs.build_type }}.apk" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📥 **Download APK:** [app-${{ inputs.build_type }}.apk](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "The APK artifact is available in the **Artifacts** section of this workflow run." >> $GITHUB_STEP_SUMMARY
